name: Publish
# Manual only. Publishing to npm is not enabled yet: this builds and packs the package, without any registry credential.
# By hand, from a clean checkout of main: `npm ci && npm test && npm publish --tag latest --access public`. `--tag latest` is required:
# the name `controlresell` already has older, higher versions, and npm 11 refuses to put `latest` on a lower version without it.
# `prepack` (run by `npm pack` and `npm publish`) builds `dist/` first; without it the package would ship without its compiled files.
on:
  workflow_dispatch:
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - name: Pack (no publication)
        run: npm pack --dry-run
